<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA 24 神聯軍 AI 預測儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { background-color: #0f172a; }
        .tag-king { background-color: rgba(234, 179, 8, 0.15); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.4); }
        .tag-sniper { background-color: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        
        /* 盤口切換器特效 */
        .mode-btn { transition: all 0.3s ease; }
        .mode-active { background-color: #2563eb; color: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .mode-inactive { background-color: transparent; color: #9ca3af; }
        .mode-inactive:hover { color: #f3f4f6; background-color: rgba(255, 255, 255, 0.05); }

        /* 分頁按鈕特效 */
        .tab-btn { transition: all 0.3s ease; }
        .tab-active { border-bottom: 2px solid #60a5fa; color: #60a5fa; font-weight: bold; }
        .tab-inactive { color: #9ca3af; border-bottom: 2px solid transparent; }
        .tab-inactive:hover { color: #d1d5db; }
        
        /* 捲軸美化 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="text-gray-200 font-sans min-h-screen pb-10">

    <nav class="border-b border-gray-800 bg-gray-900/50 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
                🏀 NBA 神聯軍 AI 預測
            </h1>
            
            <div class="bg-gray-800/80 p-1 rounded-lg flex space-x-1 border border-gray-700">
                <button id="mode-spread" onclick="switchMode('spread')" class="mode-btn mode-active px-6 py-1.5 rounded-md font-bold text-sm tracking-wide">
                    讓分盤 (Spread)
                </button>
                <button id="mode-ou" onclick="switchMode('ou')" class="mode-btn mode-inactive px-6 py-1.5 rounded-md font-bold text-sm tracking-wide">
                    大小分 (Total)
                </button>
            </div>

            <div id="date-display" class="text-sm font-medium text-gray-400 bg-gray-800 px-3 py-1 rounded-full border border-gray-700">
                載入中...
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
        
        <div class="flex space-x-6 border-b border-gray-800 mb-8">
            <button onclick="switchTab('picks')" id="btn-picks" class="tab-btn tab-active pb-3 text-lg">🎯 今日預測</button>
            <button onclick="switchTab('stats')" id="btn-stats" class="tab-btn tab-inactive pb-3 text-lg">📊 模型戰績排行榜</button>
        </div>

        <div id="tab-picks">
            <p class="text-gray-400 mb-6 text-center text-sm md:text-base">
                <span class="text-yellow-400 font-bold">👑 絕對王者</span>：硬猜勝率 >61%，無腦跟單指標<br class="md:hidden">
                <span class="text-red-400 font-bold ml-0 md:ml-4">🎯 狙擊標籤</span>：其餘模型信心值大於 53% 才會觸發
            </p>

            <div id="matchups-container" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="col-span-full text-center py-20 text-gray-500 animate-pulse" id="loading-text">讀取 AI 預測數據中...</div>
            </div>
        </div>

        <div id="tab-stats" class="hidden">
            <div class="glass-panel rounded-2xl overflow-hidden shadow-xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse cursor-default">
                        <thead>
                            <tr class="bg-gray-800/80 text-gray-300 text-sm uppercase tracking-wider">
                                <th class="p-4 font-bold border-b border-gray-700">模型名稱</th>
                                <th class="p-4 font-bold border-b border-gray-700">所屬賽道</th>
                                <th class="p-4 font-bold border-b border-gray-700 text-center">總出手數</th>
                                <th class="p-4 font-bold border-b border-gray-700 text-center">平均信心</th>
                                <th class="p-4 font-bold border-b border-gray-700 text-center text-green-400" id="win-rate-header">過盤勝率 (ATS)</th>
                                <th class="p-4 font-bold border-b border-gray-700 text-center">明細</th>
                            </tr>
                        </thead>
                        <tbody id="stats-table-body" class="divide-y divide-gray-800/50">
                            </tbody>
                    </table>
                </div>
                <div class="p-4 bg-gray-900/50 text-xs text-gray-500 text-center">
                    💡 點擊「查看」可展開該模型的完整歷史預測明細。勝率需等待賽後更新 <code>Is_Win</code> 欄位後方可結算。
                </div>
            </div>
        </div>

    </main>

    <div id="history-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-black/80 backdrop-blur-sm transition-opacity">
        <div class="glass-panel w-11/12 max-w-4xl max-h-[85vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden transform transition-transform scale-100">
            <div class="p-5 border-b border-gray-700 flex justify-between items-center bg-gray-800/90">
                <div>
                    <h2 id="modal-title" class="text-xl font-bold text-white">模型名稱</h2>
                    <p id="modal-subtitle" class="text-sm text-gray-400 mt-1">詳細出手紀錄</p>
                </div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-3xl leading-none">&times;</button>
            </div>
            
            <div class="overflow-y-auto p-0 flex-grow bg-gray-900/60">
                <table class="w-full text-left border-collapse text-sm">
                    <thead class="sticky top-0 bg-gray-800 shadow-md">
                        <tr class="text-gray-400">
                            <th class="p-3 font-semibold">日期</th>
                            <th class="p-3 font-semibold">對戰組合</th>
                            <th class="p-3 font-semibold text-center">預測球隊/大小</th>
                            <th class="p-3 font-semibold text-center">信心值</th>
                            <th class="p-3 font-semibold text-center">賽果</th>
                        </tr>
                    </thead>
                    <tbody id="modal-table-body" class="divide-y divide-gray-800/50">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 設定區
        const SNIPER_THRESHOLD = 53.0;

        // 👑 智慧判斷是否為王者模型
        function isKingModel(modelName) {
            const kingsBaseNames = ['Overall_Rank1', 'Overall_Rank2', 'Overall_Rank3', 'M014'];
            return kingsBaseNames.some(king => String(modelName).includes(king));
        }

        // 資料庫
        let spreadData = [];
        let ouData = [];
        let currentMode = 'spread';

        // ==========================================
        // 介面切換邏輯
        // ==========================================
        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('mode-spread').className = mode === 'spread' ? 'mode-btn mode-active px-6 py-1.5 rounded-md font-bold text-sm tracking-wide' : 'mode-btn mode-inactive px-6 py-1.5 rounded-md font-bold text-sm tracking-wide';
            document.getElementById('mode-ou').className = mode === 'ou' ? 'mode-btn mode-active px-6 py-1.5 rounded-md font-bold text-sm tracking-wide' : 'mode-btn mode-inactive px-6 py-1.5 rounded-md font-bold text-sm tracking-wide';
            document.getElementById('win-rate-header').innerText = mode === 'spread' ? '過盤勝率 (ATS)' : '過盤勝率 (O/U)';
            processData(currentMode === 'spread' ? spreadData : ouData);
        }

        function switchTab(tabId) {
            document.getElementById('btn-picks').className = tabId === 'picks' ? 'tab-btn tab-active pb-3 text-lg' : 'tab-btn tab-inactive pb-3 text-lg';
            document.getElementById('btn-stats').className = tabId === 'stats' ? 'tab-btn tab-active pb-3 text-lg' : 'tab-btn tab-inactive pb-3 text-lg';
            document.getElementById('tab-picks').classList.toggle('hidden', tabId !== 'picks');
            document.getElementById('tab-stats').classList.toggle('hidden', tabId !== 'stats');
        }

        // ==========================================
        // 載入與資料處理
        // ==========================================
        async function fetchCsvData(url) {
            try {
                const res = await fetch(url);
                if (!res.ok) return [];
                const text = await res.text();
                return new Promise(resolve => {
                    Papa.parse(text, {
                        header: true, dynamicTyping: true, skipEmptyLines: true,
                        complete: function(results) { resolve(results.data); }
                    });
                });
            } catch (e) {
                return [];
            }
        }

        async function loadAllPredictions() {
            const [spreadResult, ouResult] = await Promise.all([
                fetchCsvData('data/predictions_history_log.csv'),
                fetchCsvData('data/ou_predictions_history_log.csv')
            ]);
            spreadData = spreadResult;
            ouData = ouResult;

            if (spreadData.length === 0 && ouData.length === 0) {
                document.getElementById('matchups-container').innerHTML = `
                    <div class="col-span-full text-center py-20 text-red-400 font-bold">
                        ❌ 尚未找到任何預測資料，請確認 GitHub Actions 是否已成功執行。
                    </div>`;
                return;
            }
            switchMode('spread');
        }

        function processData(data) {
            const container = document.getElementById('matchups-container');
            const validData = data.filter(row => row.Game_Date && row.Matchup);
            
            if (validData.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-20 text-gray-500">此盤口目前尚無預測資料。</div>`;
                document.getElementById('stats-table-body').innerHTML = `<tr><td colspan="6" class="text-center p-4 text-gray-500">無資料</td></tr>`;
                document.getElementById('date-display').innerText = `📅 暫無資料`;
                return;
            }
            
            const dates = [...new Set(validData.map(row => row.Game_Date))].sort();
            const latestDate = dates[dates.length - 1];
            document.getElementById('date-display').innerText = `📅 最新預測：${latestDate}`;

            const todayData = validData.filter(row => row.Game_Date === latestDate);
            const matchups = {};
            todayData.forEach(row => {
                if (!matchups[row.Matchup]) matchups[row.Matchup] = [];
                matchups[row.Matchup].push(row);
            });
            renderPicks(matchups);
            renderStats(validData);
        }

        // ==========================================
        // 渲染今日預測卡片
        // ==========================================
        function renderPicks(matchups) {
            const container = document.getElementById('matchups-container');
            container.innerHTML = '';

            for (const [matchupStr, predictions] of Object.entries(matchups)) {
                const teams = matchupStr.split('@').map(t => t.trim());
                if (teams.length !== 2) continue;
                const awayTeam = teams[0], homeTeam = teams[1];

                let leftLabel = currentMode === 'spread' ? awayTeam : '大分 (OVER)';
                let rightLabel = currentMode === 'spread' ? homeTeam : '小分 (UNDER)';
                const teamTags = { [leftLabel]: { kings: [], snipers: [] }, [rightLabel]: { kings: [], snipers: [] } };

                predictions.forEach(p => {
                    let winner = String(p.Predicted_Winner).trim();
                    let targetBox;

                    if (currentMode === 'ou') {
                        let wUp = winner.toUpperCase();
                        if (wUp.includes('大') || wUp.includes('OVER') || wUp === 'O' || wUp === homeTeam.toUpperCase()) targetBox = leftLabel;
                        else targetBox = rightLabel;
                    } else {
                        targetBox = (winner.toUpperCase() === awayTeam.toUpperCase()) ? leftLabel : rightLabel;
                    }

                    if (!teamTags[targetBox]) teamTags[targetBox] = { kings: [], snipers: [] };

                    if (isKingModel(p.Model_Used)) {
                        teamTags[targetBox].kings.push(p);
                    } else if (p.Confidence_Pct >= SNIPER_THRESHOLD) {
                        teamTags[targetBox].snipers.push(p);
                    }
                });

                container.innerHTML += `
                    <div class="glass-panel rounded-2xl p-5 shadow-xl transition transform hover:-translate-y-1 hover:shadow-2xl border-t-4 ${currentMode === 'spread' ? 'border-blue-500' : 'border-purple-500'}">
                        <div class="flex justify-center items-center mb-6">
                            <div class="text-xl font-black tracking-wider text-gray-300">${awayTeam}</div>
                            <div class="mx-4 text-sm font-bold text-gray-500 bg-gray-800 px-3 py-1 rounded-full">@</div>
                            <div class="text-xl font-black tracking-wider text-white">${homeTeam}</div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            ${generateTeamSectionHTML(leftLabel, teamTags[leftLabel])}
                            ${generateTeamSectionHTML(rightLabel, teamTags[rightLabel], true)}
                        </div>
                    </div>
                `;
            }
        }

        function generateTeamSectionHTML(teamName, tags, isRight = false) {
            const bgColor = isRight ? 'bg-gray-800/50' : 'bg-gray-800/30';
            const titleColor = currentMode === 'ou' ? (isRight ? 'text-purple-300' : 'text-pink-300') : (isRight ? 'text-blue-300' : 'text-gray-300');
            
            // 🔥 在這裡拿掉王者的 Confidence_Pct 顯示！
            let kingsHTML = tags.kings.map(t => `<span class="tag-king px-2.5 py-1 rounded-md text-xs font-semibold shadow-sm inline-block mb-1">👑 ${t.Model_Used}</span>`).join(' ');
            
            // 狙擊手依然保留信心值
            let snipersHTML = tags.snipers.map(t => `<span class="tag-sniper px-2.5 py-1 rounded-md text-xs font-semibold shadow-sm inline-block mb-1">🎯 ${t.Model_Used} (${t.Confidence_Pct}%)</span>`).join(' ');

            if (!kingsHTML) kingsHTML = `<span class="text-xs text-gray-600 italic">無推薦</span>`;
            if (!snipersHTML) snipersHTML = `<span class="text-xs text-gray-600 italic">未達信心門檻</span>`;

            return `
                <div class="${bgColor} rounded-xl p-4 border border-gray-700/50">
                    <h3 class="text-lg font-bold ${titleColor} text-center border-b border-gray-700 pb-2 mb-3">${teamName}</h3>
                    <div class="mb-4">
                        <div class="text-[10px] text-gray-500 uppercase tracking-wider mb-1.5">絕對王者推薦</div>
                        <div class="flex flex-wrap gap-1">${kingsHTML}</div>
                    </div>
                    <div>
                        <div class="text-[10px] text-gray-500 uppercase tracking-wider mb-1.5">重砲狙擊 (>53%)</div>
                        <div class="flex flex-wrap gap-1">${snipersHTML}</div>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // 渲染模型戰績表
        // ==========================================
        function renderStats(allData) {
            const stats = {};
            allData.forEach(row => {
                const model = row.Model_Used;
                if (!stats[model]) {
                    stats[model] = { track: row.Track_Name || 'Unknown', totalBets: 0, confSum: 0, gradedBets: 0, wins: 0 };
                }
                
                const isKing = isKingModel(model);
                if (isKing || row.Confidence_Pct >= SNIPER_THRESHOLD) {
                    stats[model].totalBets++;
                    stats[model].confSum += row.Confidence_Pct;

                    if (row.Is_Win !== undefined && row.Is_Win !== null && row.Is_Win !== '') {
                        stats[model].gradedBets++;
                        if (row.Is_Win == 1 || String(row.Is_Win).toLowerCase() === 'true') {
                            stats[model].wins++;
                        }
                    }
                }
            });

            const tbody = document.getElementById('stats-table-body');
            tbody.innerHTML = '';

            const sortedModels = Object.keys(stats).map(key => ({ name: key, ...stats[key] })).sort((a, b) => b.totalBets - a.totalBets);

            sortedModels.forEach(m => {
                if (m.totalBets === 0) return;
                const isKing = isKingModel(m.name);
                
                // 🔥 如果是王者模型，表格內的平均信心直接顯示 "-"
                const avgConfDisplay = isKing ? '<span class="text-gray-600">-</span>' : `${(m.confSum / m.totalBets).toFixed(1)}%`;
                
                let winRateStr = `<span class="text-gray-500 text-xs px-2 py-1 bg-gray-800 rounded">待結算</span>`;
                if (m.gradedBets > 0) {
                    const winRate = ((m.wins / m.gradedBets) * 100).toFixed(1);
                    const colorClass = winRate >= 55 ? 'text-green-400 font-bold' : (winRate < 50 ? 'text-red-400' : 'text-gray-300');
                    winRateStr = `<span class="${colorClass}">${winRate}%</span> <span class="text-xs text-gray-500 ml-1">(${m.wins}W-${m.gradedBets - m.wins}L)</span>`;
                }

                const isKingIcon = isKing ? '👑 ' : '';
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-800/40 transition">
                        <td class="p-4 font-medium text-gray-200">${isKingIcon}${m.name}</td>
                        <td class="p-4 text-gray-400 text-sm hidden md:table-cell">${m.track}</td>
                        <td class="p-4 text-center font-bold text-blue-400">${m.totalBets}</td>
                        <td class="p-4 text-center text-gray-400 hidden sm:table-cell">${avgConfDisplay}</td>
                        <td class="p-4 text-center">${winRateStr}</td>
                        <td class="p-4 text-center">
                            <button onclick="openModal('${m.name}')" class="${currentMode === 'spread' ? 'bg-blue-600 hover:bg-blue-500' : 'bg-purple-600 hover:bg-purple-500'} text-white text-xs px-3 py-1.5 rounded shadow transition-colors">
                                查看
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        // ==========================================
        // Modal 歷史明細邏輯
        // ==========================================
        function openModal(modelName) {
            const isKing = isKingModel(modelName);
            document.getElementById('modal-title').innerHTML = `${isKing ? '👑' : '🎯'} ${modelName} <span class="text-sm ml-2 font-normal text-gray-400">(${currentMode === 'spread' ? '讓分盤' : '大小分'})</span>`;
            
            const tbody = document.getElementById('modal-table-body');
            tbody.innerHTML = ''; 

            const activeData = currentMode === 'spread' ? spreadData : ouData;
            const history = activeData.filter(row => {
                if (row.Model_Used !== modelName) return false;
                if (!isKing && row.Confidence_Pct < SNIPER_THRESHOLD) return false;
                return true;
            });

            history.sort((a, b) => new Date(b.Game_Date) - new Date(a.Game_Date));

            history.forEach(row => {
                let resultStr = `<span class="text-gray-500 text-xs px-2 py-1 bg-gray-800 rounded">待結算</span>`;
                if (row.Is_Win !== undefined && row.Is_Win !== null && row.Is_Win !== '') {
                    resultStr = (row.Is_Win == 1 || String(row.Is_Win).toLowerCase() === 'true') 
                        ? `<span class="text-green-400 font-bold px-2 py-1 bg-green-400/10 rounded">✅ 過盤</span>`
                        : `<span class="text-red-400 px-2 py-1 bg-red-400/10 rounded">❌ 輸盤</span>`;
                }
                
                let printedWinner = row.Predicted_Winner;
                if (currentMode === 'ou') {
                    let wUp = String(printedWinner).toUpperCase();
                    if (wUp === '1' || wUp === 'OVER' || wUp === '大分' || wUp === 'O') printedWinner = '<span class="text-pink-400 font-bold">大分 (OVER)</span>';
                    else if (wUp === '0' || wUp === 'UNDER' || wUp === '小分' || wUp === 'U') printedWinner = '<span class="text-purple-400 font-bold">小分 (UNDER)</span>';
                }

                // 🔥 如果是王者模型，彈窗內的信心值也顯示 "-"
                const confDisplay = isKing ? '<span class="text-gray-600">-</span>' : `${row.Confidence_Pct}%`;

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-800/40 transition">
                        <td class="p-3 text-gray-300">${row.Game_Date}</td>
                        <td class="p-3 text-gray-400">${row.Matchup}</td>
                        <td class="p-3 text-center font-bold text-white">${printedWinner}</td>
                        <td class="p-3 text-center text-blue-300">${confDisplay}</td>
                        <td class="p-3 text-center">${resultStr}</td>
                    </tr>
                `;
            });

            document.getElementById('history-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('history-modal').classList.add('hidden');
        }

        document.getElementById('history-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // 啟動程式
        loadAllPredictions();
    </script>
</body>
</html>

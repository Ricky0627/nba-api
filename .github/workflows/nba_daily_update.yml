name: Debug - Generate Injury

on:
  # 只保留手動觸發，方便除錯
  workflow_dispatch: 

jobs:
  debug-script:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 取得程式碼 (Checkout repository)
      uses: actions/checkout@v4

    - name: 🐍 設定 Python 3.10 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # 依賴你剛剛建立的 requirements.txt

    - name: 📦 安裝必備套件 (Install dependencies)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🧪 單獨測試 generate_injury.py
      run: |
        # 確保 data 資料夾存在
        mkdir -p data
        
        # 只執行這支有問題的腳本！
        python src/generate_injury.py

    - name: 📤 備份測試資料包 (Upload Artifacts)
      # 不管上面有沒有報錯，都嘗試把 data 資料夾打包下來讓我們檢查
      if: always() 
      uses: actions/upload-artifact@v4
      with:
        name: debug-injury-data
        path: data/
        retention-days: 3
name: NBA Daily AI Pipeline

on:
  workflow_dispatch: # 只有手動觸發，方便除錯

jobs:
  debug-fetch-games:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 取得程式碼
      uses: actions/checkout@v4

    - name: 🐍 設定 Python 3.10 
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 📦 安裝套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🐛 測試抓取今日賽程 (fetch_games.py)
      env:
        PROXY_URL: ${{ secrets.PROXY_URL }}
        PROXY_URL2: ${{ secrets.PROXY_URL2 }} # 注入新密碼
      run: |
        mkdir -p data
        python src/fetch_games.py
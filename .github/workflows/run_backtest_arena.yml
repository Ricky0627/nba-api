name: ⚔️ 回測競技場 (Static vs Rolling)

on:
  workflow_dispatch: # 只有手動觸發，你可以隨時按按鈕執行

jobs:
  backtest-arena:
    runs-on: windows-latest
    
    # 👇 加入這兩行，強制 Python 終端機輸出為 UTF-8
    env:
      PYTHONIOENCODING: utf-8
      
    steps:
    - name: 📥 取得程式碼
      uses: actions/checkout@v4
      
    # ... 下面的步驟保持不變 ...

    - name: 🐍 設定 Python 3.10 
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 📦 安裝套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🏗️ 第一階段：構建終極特徵大表 (Feature Engineering)
      run: |
        # 重新計算並生成最乾淨、無錯位的 ml_features_master.csv
        python src/predict_today.py  # 👈 直接呼叫預測腳本，裡面會先確保特徵表是最新的


name: ⚔️ 回測競技場 (Static vs Rolling)

on:
  workflow_dispatch: # 只有手動觸發，你可以隨時按按鈕執行

jobs:
  backtest-arena:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 取得程式碼
      uses: actions/checkout@v4

    - name: 🐍 設定 Python 3.10 
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 📦 安裝套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🏗️ 第一階段：構建終極特徵大表 (Feature Engineering)
      run: |
        # 重新計算並生成最乾淨、無錯位的 ml_features_master.csv
        python src/build_model_features.py

    - name: 💾 儲存 GitHub 特徵大表 (供本地對比抓漏)
      uses: actions/upload-artifact@v4
      with:
        name: github-ml-features-master # 下載下來的壓縮檔名稱
        path: data/ml_features_master.csv # 指定要打包的檔案路徑
        retention-days: 3 # 設定保存天數 (3天後自動刪除節省空間)

    - name: ⚔️ 第二階段：啟動神聯軍大對決 (Backtest Arena)
      run: |
        # 載入大表進行 9 年數據的靜態 vs 滾動回測
        python src/backtest_compare.py
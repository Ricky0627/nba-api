name: ⚔️ 回測競技場 (Static vs Rolling)

on:
  workflow_dispatch: # 只有手動觸發，你可以隨時按按鈕執行

jobs:
  backtest-arena:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 取得程式碼
      uses: actions/checkout@v4

    - name: 🐍 設定 Python 3.10 
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 📦 安裝套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: ⚔️ 第二階段：啟動神聯軍大對決 (Backtest Arena)
      run: |
        # 載入大表進行 9 年數據的靜態 vs 滾動回測
        python src/backtest_compare.py